<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>Flat Mascot Style — Validation</title>
<style>
  :root{ --bg:#efeae3; --panel:#ffffff; --ink:#241c17; --ink-dim:#6b6058; --line:rgba(38,30,24,0.14); }
  @media (prefers-color-scheme: dark){ :root{ --bg:#181410; --panel:#221c17; --ink:#efe9e2; --ink-dim:#a89e93; --line:rgba(255,255,255,0.1);} }
  :root[data-theme="dark"]{ --bg:#181410; --panel:#221c17; --ink:#efe9e2; --ink-dim:#a89e93; --line:rgba(255,255,255,0.1); }
  :root[data-theme="light"]{ --bg:#efeae3; --panel:#ffffff; --ink:#241c17; --ink-dim:#6b6058; --line:rgba(38,30,24,0.14); }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif; display:flex; justify-content:center; padding:40px; }
  .wrap{ max-width:520px; display:flex; flex-direction:column; gap:16px; align-items:center; text-align:center; }
  h1{ font-size:20px; margin:0; }
  p{ color:var(--ink-dim); font-size:14px; max-width:50ch; line-height:1.5; margin:0; }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:24px; }
  img{ image-rendering:pixelated; width:288px; height:288px;
    background:repeating-conic-gradient(#00000010 0% 25%, transparent 0% 50%) 0 0/16px 16px; border-radius:8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Flat Mascot Style — walidacja</h1>
  <p>64×64. Zakrzywiony czubek kapelusza, falista broda (per-kolumna, nie taper do punktu), pastorał-laska, gestykulująca wolna ręka, wewnętrzny outline (szew kapelusz→twarz, broda→szata), płaskie 2-tonowe cieniowanie, stonowana paleta bez akcentu.</p>
